name: MacRemote
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Public-source placeholders. Choose your own Team and unique bundle IDs
    # before installing on physical devices; see SETUP.md.

targets:
  MacRemoteHost:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MacHost
        excludes:
          - "App/Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MacRemote.host
        PRODUCT_NAME: "Mac Remote"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: MacHost/App/Info.plist
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  MacRemoteSharedTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Shared
      - path: SharedTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MacRemote.sharedtests
        GENERATE_INFOPLIST_FILE: YES

  iPhoneRemote:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iPhoneRemote
        excludes:
          - "App/Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MacRemote.mobile
        PRODUCT_NAME: "Mac Remote"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: iPhoneRemote/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

  iPhoneRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iPhoneRemoteUITests
    dependencies:
      - target: iPhoneRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MacRemote.uitests
        TEST_TARGET_NAME: iPhoneRemote
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MacRemoteHost:
    build:
      targets:
        MacRemoteHost: all
    run:
      config: Debug
  MacRemoteSharedTests:
    build:
      targets:
        MacRemoteSharedTests: all
    test:
      config: Debug
      targets:
        - MacRemoteSharedTests
  iPhoneRemote:
    build:
      targets:
        iPhoneRemote: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iPhoneRemoteUITests
